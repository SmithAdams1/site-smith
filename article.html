  <script>
    // Supabase Setup
    const SUPABASE_URL = 'https://bcjtkfipcfvvitglgpys.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjanRrZmlwY2Z2dml0Z2xncHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNDU3NjcsImV4cCI6MjA5MTgyMTc2N30.kgnE2E-xDQT855to1Nz8LNKtwIBGw2QsIw81Us3B_ZA';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // i18n: pega title/excerpt/content traduzidos quando disponíveis. Fallback EN.
    function pickPostText(post, field) {
        // A /pt/ URL is authoritative (server-rendered head + crawlable PT body);
        // otherwise fall back to the stored cmsLocale.
        var _p = (location.pathname || '').replace(/\/+$/, '');
        const locale = (_p === '/pt' || _p.indexOf('/pt/') === 0)
            ? 'pt' : (localStorage.getItem('cmsLocale') || 'en');
        if (locale === 'en') return post[field];
        return (post.translations && post.translations[locale] && post.translations[locale][field]) || post[field];
    }

    async function fetchPost() {
        // Get slug from injected variable, pathname, or URL ?slug=
        let slug = null;
        if(window.INJECTED_SLUG) {
            slug = window.INJECTED_SLUG;
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            slug = urlParams.get('slug');
            if(!slug && window.location.pathname.includes('/blog/')) {
                slug = window.location.pathname.split('/').filter(Boolean).pop();
            }
        }

        if(!slug) return window.location.href = '/blog.html';

        const { data, error } = await supabaseClient
            .from('posts')
            .select('*')
            .eq('slug', slug)
            .single();

        if (error || !data) {
            console.error(error);
            document.getElementById('article-loader').innerHTML = '<div class="text-center mt-32 text-2xl font-bold">404 - Article Not Found</div><div class="text-center mt-4"><a href="/blog.html" class="text-blue-500 hover:underline">Go Back</a></div>';
            return;
        }

        // Fill HTML - usa versão traduzida se disponível, senão fallback EN
        const t_title   = pickPostText(data, 'title');
        const t_content = pickPostText(data, 'content');
        document.title = t_title + " | Smith & Adams";
        document.getElementById('post-title').textContent = t_title;
        document.getElementById('post-category').textContent = data.category;
        document.getElementById('post-date').textContent = new Date(data.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        document.getElementById('post-read').textContent = data.read_time;

        let coverImg = data.image_url;
        // If it's a legacy static relative image from DB mock, normalize it
        if(coverImg && !coverImg.startsWith('http')) {
            if(coverImg.startsWith('.')) coverImg = coverImg.substring(1);
        }
        document.getElementById('post-image').src = coverImg;

        document.getElementById('post-content').innerHTML = t_content;

        document.getElementById('article-loader').classList.add('hidden');
        document.getElementById('article-main').classList.remove('hidden');
    }

    fetchPost();
  </script>
