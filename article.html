  <main class="hidden pt-[110px] pb-24" id="article-main">

        <a href="blog.html" class="inline-flex items-center gap-2 text-gray-500 font-bold uppercase text-xs tracking-widest hover:text-[#0C1E28] transition-colors mb-8">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            Back to Journal
        </a>
        <div class="mb-6 flex justify-center items-center gap-4">
            <span id="post-category" class="c-pill">Category</span>
            <span id="post-date" class="text-gray-400 font-bold text-sm tracking-widest uppercase">Date</span>
            <span class="text-gray-300">•</span>
            <span id="post-read" class="text-gray-400 font-bold text-sm tracking-widest uppercase">Read Time</span>

    <!-- Feature Image -->
    <div class="max-w-[1200px] mx-auto px-4 md:px-8 mb-16">

        </div>
    </div>

    <!-- Content -->
    <article class="max-w-[800px] mx-auto px-6 post-content" id="post-content">

    <!-- Social Share Fake -->

  </main>

  <script>
    // Supabase Setup
    const SUPABASE_URL = 'https://bcjtkfipcfvvitglgpys.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjanRrZmlwY2Z2dml0Z2xncHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNDU3NjcsImV4cCI6MjA5MTgyMTc2N30.kgnE2E-xDQT855to1Nz8LNKtwIBGw2QsIw81Us3B_ZA';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchPost() {
        // Get slug from URL ?slug=
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        if(!slug) return window.location.href = 'blog.html';

        const { data, error } = await supabaseClient
            .from('posts')
            .select('*')
            .eq('slug', slug)
            .single();

        if (error || !data) {
            console.error(error);
            document.getElementById('article-loader').innerHTML = '<div class="text-center mt-32 text-2xl font-bold">404 - Article Not Found</div><div class="text-center mt-4"><a href="blog.html" class="text-blue-500 hover:underline">Go Back</a></div>';
            return;
        }

        // Fill HTML
        document.title = data.title + " | Smith & Adams";
        document.getElementById('post-title').textContent = data.title;
        document.getElementById('post-category').textContent = data.category;
        document.getElementById('post-date').textContent = new Date(data.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        document.getElementById('post-read').textContent = data.read_time;
        
        let coverImg = data.image_url;
        // If it's a legacy static relative image from DB mock, normalize it
        if(coverImg && !coverImg.startsWith('http')) {
            if(coverImg.startsWith('.')) coverImg = coverImg.substring(1);
        }
        document.getElementById('post-image').src = coverImg;

        document.getElementById('post-content').innerHTML = data.content;

        document.getElementById('article-loader').classList.add('hidden');
        document.getElementById('article-main').classList.remove('hidden');
    }

    fetchPost();
  </script>
