<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Smith & Adams - Meet the Team (preview)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
<style>
  :root{--navy:#11222D;--gold:#B58B45;--champ:#D6C29A;--paper:#FDFCF9;--line:#E7E2D6;--muted:#6A7883;--stone:#EEF0EE;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(40px,7vw,96px) clamp(20px,5vw,56px);}
  .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 14px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(30px,5.4vw,56px);line-height:1.03;letter-spacing:-.01em;margin:0 0 14px;}
  .lead{color:var(--muted);font-size:16px;line-height:1.6;max-width:62ch;margin:0 0 8px;}
  .sec-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:48px 0 20px;padding-top:22px;border-top:1px solid var(--line);}
  .grid{display:grid;gap:clamp(14px,2vw,22px);}
  .grid--lead{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
  .grid--team{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .mt{margin:0;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(16px);
    transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);}
  .mt.in{opacity:1;transform:none;}
  .mt__ph{position:relative;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#f3f4f2,var(--stone));border:1px solid var(--line);border-radius:3px;
    overflow:hidden;transition:border-color .35s ease,box-shadow .35s ease;}
  .mt--lead .mt__ph{aspect-ratio:4/5;}
  .mt--team .mt__ph{aspect-ratio:1/1;}
  .mt__ini{font-family:'Playfair Display',Georgia,serif;font-weight:500;color:var(--navy);opacity:.32;
    letter-spacing:.02em;}
  .mt--lead .mt__ini{font-size:38px;} .mt--team .mt__ini{font-size:26px;}
  .mt__ph::after{content:"PHOTO";position:absolute;bottom:8px;left:0;right:0;text-align:center;
    font-size:8.5px;letter-spacing:.18em;color:var(--muted);opacity:.55;}
  .mt:hover .mt__ph{border-color:var(--champ);box-shadow:0 14px 30px rgba(17,34,45,.10);}
  figcaption{display:flex;flex-direction:column;gap:3px;}
  .mt__name{font-family:'Playfair Display',Georgia,serif;color:var(--navy);}
  .mt--lead .mt__name{font-size:18px;} .mt--team .mt__name{font-size:15px;}
  .mt__role{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .mt__ph img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;}
  .mt__ph--img::after{display:none;}
  @media (prefers-reduced-motion:reduce){.mt{opacity:1;transform:none;transition:none;}}
</style>
</head>
<body>

</div>
<script>
  (function(){
    var els=[].slice.call(document.querySelectorAll('.mt'));
    if(!('IntersectionObserver'in window)){els.forEach(function(e){e.classList.add('in')});return;}
    var io=new IntersectionObserver(function(en){en.forEach(function(e){
      if(e.isIntersecting){var el=e.target,i=els.indexOf(el);
        setTimeout(function(){el.classList.add('in')},Math.min(i,14)*40);io.unobserve(el);}})},
      {rootMargin:'0px 0px -8% 0px',threshold:.1});
    els.forEach(function(e){io.observe(e)});
  })();
</script>
