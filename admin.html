        // Quill Custom Image Handler to upload direct to Supabase
        function selectLocalImage() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async () => {
                const file = input.files[0];
                if (/^image\//.test(file.type)) {
                    saveToServer(file);
                } else {
                    console.warn('You could only upload images.');
                }
            };
        }

        // --- IMAGE COMPRESSION UTILITY ---
        function compressImage(file, maxWidth = 1920, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            if (!blob) return reject(new Error('Canvas is empty'));
                            // Convert to WebP for maximum compression
                            const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + "_compressed.webp", { type: 'image/webp' });
                            resolve(compressedFile);
                        }, 'image/webp', quality);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        async function saveToServer(file) {
            try {
                // Compress before upload for blazing fast inline loading (800px, 60% quality)
                const compressedFile = await compressImage(file, 800, 0.60);
                const fileName = `inline_${Math.random()}.webp`;
                
                const { data, error } = await supabaseClient.storage
                    .from('blog-media')
                    .upload(fileName, compressedFile, { cacheControl: '3600', upsert: false });
                    
                if (error) {
                    alert("Image upload failed: " + error.message);
                    return;
                }
                
                const { data: urlData } = supabaseClient.storage.from('blog-media').getPublicUrl(fileName);
                insertToEditor(urlData.publicUrl);
            } catch(e) {
                alert("Failed to compress image: " + e.message);
            }
        }

        function insertToEditor(url) {
            const range = quill.getSelection();
            if(range) {
                quill.insertEmbed(range.index, 'image', url);
            } else {
                quill.insertEmbed(quill.getLength(), 'image', url);
            }
        }

        // -------------------------
        // AUTHENTICATION
        // -------------------------
        
        async function checkSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                loadPosts();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('hidden');
            }
        }
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Signing in...';
            
            const user = document.getElementById('username').value + "@smithandadams.com";
            const pass = document.getElementById('password').value;
            const err = document.getElementById('login-error');
            
            const { error } = await supabaseClient.auth.signInWithPassword({ email: user, password: pass });
            if (error) {
                err.textContent = error.message;
                err.classList.remove('hidden');
            } else {
                window.location.reload();

            btn.innerHTML = 'SIGN IN';
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();

        checkSession();

        // -------------------------
        // DASHBOARD NAVIGATION
        // -------------------------
        function showView(viewId) {
            ['posts-view', 'editor-view', 'content-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.toggle('bg-white/10', b.dataset.view === viewId);
            });

            if(viewId === 'editor-view') {
                document.getElementById('post-form').reset();
                document.getElementById('post-id').value = '';
                quill.root.innerHTML = '';
                document.getElementById('image-preview').classList.add('hidden');
                document.getElementById('editor-title').textContent = 'Create New Post';
            }
            if(viewId === 'posts-view') loadPosts();
            if(viewId === 'content-view') openSiteContent();
        }

        // -------------------------
        // POST CRUD
        // -------------------------
        async function loadPosts() {
            const { data, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('posts-tbody');
            if(error) return console.error(error);
            
            tbody.innerHTML = '';
            data.forEach(post => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-bold text-[#0C1E28]">${post.title}</td>
                    <td class="p-4"><span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold uppercase">${post.category}</span></td>
                    <td class="p-4 text-sm text-gray-500">${new Date(post.created_at).toLocaleDateString()}</td>
                    <td class="p-4 text-right">
                        <button onclick='editPost(${JSON.stringify(post).replace(/'/g, "&#39;")})' class="text-blue-500 hover:underline mr-4 font-bold text-sm">Edit</button>
                        <button onclick='deletePost("${post.id}")' class="text-red-500 hover:underline font-bold text-sm">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.editPost = function(post) {
            showView('editor-view');
            document.getElementById('editor-title').textContent = 'Edit Post';
            document.getElementById('post-id').value = post.id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-category').value = post.category;
            document.getElementById('post-readtime').value = post.read_time;
            document.getElementById('post-excerpt').value = post.excerpt;
            document.getElementById('post-image-url').value = post.image_url;
            
            if (post.image_url) {
                const img = document.getElementById('image-preview');
                img.src = post.image_url;
                img.classList.remove('hidden');
            }
            quill.root.innerHTML = post.content;
        };

        let postToDeleteId = null;

        window.deletePost = function(id) {
            postToDeleteId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        };

        window.closeDeleteModal = function() {
            postToDeleteId = null;
            document.getElementById('delete-modal').classList.add('hidden');
        };

        window.confirmDeletePost = async function() {
            if(postToDeleteId) {
                const btn = document.querySelector('#delete-modal button.bg-red-600');
                const originalText = btn.textContent;
                btn.textContent = "Deleting...";
                btn.disabled = true;
                
                await supabaseClient.from('posts').delete().eq('id', postToDeleteId);
                
                btn.textContent = originalText;
                btn.disabled = false;
                closeDeleteModal();
                loadPosts();
            }
        };

        function generateSlug(text) {
            return text.toString().toLowerCase().trim()
                .replace(/\\s+/g, '-')
                .replace(/[^\\w\\-]+/g, '')
                .replace(/\\-\\-+/g, '-');
        }

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const err = document.getElementById('editor-error');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader" class="animate-spin"></i> Saving...`;
            lucide.createIcons();
            
            try {
                // 1. Upload Image if selected
                const fileInput = document.getElementById('post-image');
                let publicUrl = document.getElementById('post-image-url').value;
                
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    // Extreme Compress Cover Image (800px width, 60% quality WebP)
                    const compressedFile = await compressImage(file, 800, 0.60);
                    const fileName = `cover_${Math.random()}.webp`;
                    
                    const { data, error: uploadErr } = await supabaseClient.storage
                        .from('blog-media')
                        .upload(fileName, compressedFile, { cacheControl: '3600', upsert: false });
                        
                    if (uploadErr) throw uploadErr;
                    
                    const { data: urlData } = supabaseClient.storage.from('blog-media').getPublicUrl(fileName);
                    publicUrl = urlData.publicUrl;
                }

                if (!publicUrl) throw new Error("A cover image is required!");

                // 2. Save Post
                const postData = {
                    title: document.getElementById('post-title').value,
                    slug: generateSlug(document.getElementById('post-title').value),
                    category: document.getElementById('post-category').value,
                    read_time: document.getElementById('post-readtime').value,
                    excerpt: document.getElementById('post-excerpt').value,
                    content: quill.root.innerHTML,
                    image_url: publicUrl
                };

                const id = document.getElementById('post-id').value;
                if (id) {
                    const { error } = await supabaseClient.from('posts').update(postData).eq('id', id);
                    if (error) throw error;
                } else {
                    // Create New
                    const { error } = await supabaseClient.from('posts').insert([postData]);
                    if (error) throw error;
                }

                showView('posts-view');
            } catch (error) {
                err.textContent = error.message;
                err.classList.remove('hidden');
            }
            
            btn.innerHTML = originalText;

        const contentValues = {};   // valores atuais carregados do banco
        const contentDirty  = {};   // chaves alteradas que precisam salvar

        let currentPageId = null;

        function buildPageNav() {
            const nav = document.getElementById('content-page-nav');
            nav.innerHTML = '';
            Object.entries(SITE_SCHEMA).forEach(([id, page]) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.pageId = id;
                btn.className = 'page-pill px-4 py-2 rounded-full text-sm font-bold border transition-colors';
                btn.textContent = page.label;
                btn.onclick = () => selectPage(id);
                nav.appendChild(btn);
            });
        }

        function selectPage(id) {
            if (Object.keys(contentDirty).length > 0 && id !== currentPageId) {
                if (!confirm('Você tem alterações não salvas. Trocar de página vai descartá-las.')) return;
                for (const k in contentDirty) delete contentDirty[k];
            }
            currentPageId = id;
            const page = SITE_SCHEMA[id];
            document.getElementById('content-preview-link').href = page.preview;
            document.getElementById('content-page-title').textContent = 'Editando: ' + page.label;
            document.querySelectorAll('.page-pill').forEach(b => {
                const active = b.dataset.pageId === id;
                b.classList.toggle('bg-[#0C1E28]', active);
                b.classList.toggle('text-white', active);
                b.classList.toggle('border-[#0C1E28]', active);
                b.classList.toggle('bg-white', !active);
                b.classList.toggle('text-[#0C1E28]', !active);
                b.classList.toggle('border-gray-200', !active);
                b.classList.toggle('hover:border-[#0C1E28]', !active);
            });
            renderContentFields(id);
        }

        async function openSiteContent() {
            buildPageNav();
            await loadContentValues();
            selectPage(currentPageId || Object.keys(SITE_SCHEMA)[0]);
        }

        async function loadContentValues() {
            const { data, error } = await supabaseClient.from('site_content').select('key,value');
            if (error) {
                showContentStatus('Erro ao carregar conteúdo: ' + error.message, true);
                return;
            }
            data.forEach(r => contentValues[r.key] = r.value);
        }

        function renderContentFields(pageId) {
            const page = SITE_SCHEMA[pageId];
            const wrap = document.getElementById('content-fields');
            const previewLink = document.getElementById('content-preview-link');
            previewLink.href = page.preview;

            // Reset dirty when switching pages
            for (const k in contentDirty) delete contentDirty[k];

            wrap.innerHTML = '';
            page.sections.forEach(section => {
                const sec = document.createElement('div');
                sec.innerHTML = `<h3 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 mt-2">${section.title}</h3>`;
                section.fields.forEach(field => {
                    sec.appendChild(buildFieldEl(field));
                });
                wrap.appendChild(sec);
            });
        }

        function buildFieldEl(field) {
            const stored = contentValues[field.key];               // valor já no banco (ou undefined)
            const isEdited = stored !== undefined;
            const initial = isEdited ? stored : (field.default ?? '');  // pré-preenche com texto atual do HTML
            const wrapper = document.createElement('div');
            wrapper.className = 'space-y-1';

            const labelRow = document.createElement('div');
            labelRow.className = 'flex justify-between items-center gap-2';
            const labelLeft = document.createElement('div');
            labelLeft.className = 'flex items-center gap-2';
            labelLeft.innerHTML = `<label class="block text-sm font-bold text-gray-700">${field.label}</label>`;
            const badge = document.createElement('span');
            badge.className = isEdited
                ? 'text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-bold'
                : 'text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 font-bold';
            badge.textContent = isEdited ? 'Editado' : 'Texto atual';
            labelLeft.appendChild(badge);
            labelRow.appendChild(labelLeft);
            const counter = document.createElement('span');
            counter.className = 'text-xs text-gray-400 font-mono';
            labelRow.appendChild(counter);
            wrapper.appendChild(labelRow);

            const updateCounter = (val) => {
                const len = (val || '').length;
                counter.textContent = `${len}/${field.max}`;
                counter.classList.toggle('text-red-500', len > field.max || (field.min && len < field.min));
            };

            if (field.type === 'longtext') {
                const ta = document.createElement('textarea');
                ta.rows = 3;
                ta.className = 'w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:border-[#466DEE]';
                ta.minLength = field.min || 0;
                ta.maxLength = field.max;
                ta.value = initial;
                ta.oninput = () => { contentDirty[field.key] = ta.value; updateCounter(ta.value); };
                wrapper.appendChild(ta);
                updateCounter(initial);
            } else if (field.type === 'image') {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.className = 'w-full border border-gray-200 rounded-lg p-2 bg-white text-sm';

                const urlInput = document.createElement('input');
                urlInput.type = 'text';
                urlInput.value = initial;
                urlInput.placeholder = 'URL da imagem (preenchida ao fazer upload)';
                urlInput.className = 'w-full border border-gray-200 rounded-lg p-2 mt-2 text-sm';
                urlInput.oninput = () => { contentDirty[field.key] = urlInput.value; };

                const preview = document.createElement('img');
                preview.className = 'mt-2 h-24 rounded-lg object-cover';
                preview.style.display = initial ? 'block' : 'none';
                preview.src = initial;

                fileInput.onchange = async () => {
                    const f = fileInput.files[0];
                    if (!f) return;
                    fileInput.disabled = true;
                    try {
                        const compressed = await compressImage(f, 1600, 0.75);
                        const fname = `site_${Date.now()}_${Math.random().toString(36).slice(2,8)}.webp`;
                        const { error: up } = await supabaseClient.storage.from('site-media').upload(fname, compressed);
                        if (up) throw up;
                        const { data: u } = supabaseClient.storage.from('site-media').getPublicUrl(fname);
                        urlInput.value = u.publicUrl;
                        contentDirty[field.key] = u.publicUrl;
                        preview.src = u.publicUrl;
                        preview.style.display = 'block';
                    } catch(e) {
                        alert('Falha no upload: ' + (e.message || e));
                    } finally {
                        fileInput.disabled = false;
                    }
                };

                wrapper.appendChild(fileInput);
                wrapper.appendChild(urlInput);
                wrapper.appendChild(preview);
            } else {
                // text | url | video → input
                const input = document.createElement('input');
                input.type = (field.type === 'url' || field.type === 'video') ? 'url' : 'text';
                input.className = 'w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:border-[#466DEE]';
                input.minLength = field.min || 0;
                input.maxLength = field.max;
                input.value = initial;
                input.oninput = () => { contentDirty[field.key] = input.value; updateCounter(input.value); };
                wrapper.appendChild(input);
                updateCounter(initial);
            }

            if (field.helper) {
                const h = document.createElement('p');
                h.className = 'text-xs text-gray-400';
                h.textContent = field.helper;
                wrapper.appendChild(h);
            }
            return wrapper;
        }

        function showContentStatus(msg, isError) {
            const el = document.getElementById('content-status');
            el.textContent = msg;
            el.className = `mb-4 text-sm ${isError ? 'text-red-500' : 'text-green-600'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        document.getElementById('content-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('content-save-btn');
            const original = btn.innerHTML;
            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            // Validate all dirty fields against schema
            const pageId = currentPageId;
            const allFields = SITE_SCHEMA[pageId].sections.flatMap(s => s.fields);
            const fieldByKey = Object.fromEntries(allFields.map(f => [f.key, f]));
            const errors = [];
            for (const [key, val] of Object.entries(contentDirty)) {
                const f = fieldByKey[key];
                if (!f) continue;
                const len = (val || '').length;
                if (f.min && len < f.min) errors.push(`"${f.label}" precisa de pelo menos ${f.min} caracteres`);
                if (f.max && len > f.max) errors.push(`"${f.label}" excede ${f.max} caracteres`);
            }
            if (errors.length) {
                showContentStatus(errors.join(' · '), true);
                btn.innerHTML = original; btn.disabled = false;
                return;
            }

            const rows = Object.entries(contentDirty).map(([key, value]) => ({ key, value }));
            if (rows.length === 0) {
                showContentStatus('Nada para salvar.', false);
                btn.innerHTML = original; btn.disabled = false;
                return;
            }

            const { error } = await supabaseClient.from('site_content').upsert(rows, { onConflict: 'key' });
            if (error) {
                showContentStatus('Erro ao salvar: ' + error.message, true);
            } else {
                Object.assign(contentValues, contentDirty);
                for (const k in contentDirty) delete contentDirty[k];
                showContentStatus(`${rows.length} campo(s) salvo(s).`, false);
            }
            btn.innerHTML = original; btn.disabled = false;
        });

    </script>
