<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Smith & Adams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Satoshi', sans-serif; background-color: #FDFCF9; }
        .hidden { display: none !important; }
        #editor-container { height: 400px; background: white; border-radius: 0 0 8px 8px; }
        .ql-toolbar { border-radius: 8px 8px 0 0; background: white; }
    </style>

  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-[#0C1E28]">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <img src="./logo.png" class="h-8 mx-auto invert mb-6 opacity-80" alt="Logo">
                <h2 class="text-2xl font-bold text-[#0C1E28]">Admin Console</h2>
            </div>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" id="username" class="w-full border-b-2 border-gray-200 py-2 focus:outline-none focus:border-[#0C1E28] transition-colors" placeholder="admin" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" class="w-full border-b-2 border-gray-200 py-2 focus:outline-none focus:border-[#0C1E28] transition-colors" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-[#0C1E28] text-white py-3 rounded-full font-bold hover:bg-opacity-90 transition-all">SIGN IN</button>
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden min-h-screen flex w-full">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-[#0C1E28] text-white flex flex-col">
            <div class="p-6 border-b border-gray-700">
                <h2 class="font-bold text-xl uppercase tracking-widest">S&A Admin</h2>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="showView('posts-view')" class="w-full text-left px-4 py-3 rounded-lg bg-white/10 font-medium flex items-center gap-3">
                    <i data-lucide="file-text"></i> All Posts
                </button>
                <button onclick="showView('editor-view')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white/5 font-medium flex items-center gap-3">
                    <i data-lucide="plus-circle"></i> Create Post
                </button>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-gray-400 hover:text-white flex items-center gap-3">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto w-full">
            
            <!-- Posts View -->
            <div id="posts-view">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold text-[#0C1E28]">Manage Posts</h1>
                    <button onclick="showView('editor-view')" class="bg-[#466DEE] text-white px-6 py-2 rounded-full font-medium hover:bg-opacity-90">Write New</button>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100 uppercase text-xs tracking-wider text-gray-500">
                                <th class="p-4">Title</th>
                                <th class="p-4">Category</th>
                                <th class="p-4">Date</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="posts-tbody" class="divide-y divide-gray-100">
                            <!-- Injected -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Editor View -->
            <div id="editor-view" class="hidden max-w-4xl">
                <div class="flex justify-between items-center mb-8">
                    <h1 id="editor-title" class="text-3xl font-bold text-[#0C1E28]">Create New Post</h1>
                    <button onclick="showView('posts-view')" class="text-gray-500 hover:text-black">Cancel</button>
                </div>
                
                <form id="post-form" class="space-y-6">
                    <input type="hidden" id="post-id">
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div class="col-span-2">
                            <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Title</label>
                            <input type="text" id="post-title" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:border-[#466DEE]" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Category</label>
                            <select id="post-category" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:border-[#466DEE]" required>
                                <option value="Investment">Investment</option>
                                <option value="Real Estate">Real Estate</option>
                                <option value="Lifestyle">Lifestyle</option>
                                <option value="Portugal">Portugal</option>
                                <option value="Marketing">Marketing</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Read Time</label>
                            <input type="text" id="post-readtime" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:border-[#466DEE]" placeholder="ex: 6 min read" required>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Cover Image Upload</label>
                            <input type="file" id="post-image" accept="image/*" class="w-full border border-gray-200 rounded-lg p-2 bg-white">
                            <input type="hidden" id="post-image-url">
                            <img id="image-preview" class="mt-4 h-40 rounded-lg object-cover hidden">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Short Excerpt</label>
                            <textarea id="post-excerpt" rows="2" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:border-[#466DEE]" required></textarea>
                        </div>
                    </div>

                    <div class="col-span-2 mt-4">
                        <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Full Content</label>
                        <div id="editor-container"></div>
                    </div>

                    <button type="submit" id="save-btn" class="w-full bg-[#0C1E28] text-white py-4 rounded-xl font-bold hover:bg-opacity-90 transition-all text-lg flex justify-center items-center gap-2">
                        <span>PUBLISH POST</span>
                    </button>
                    <div id="editor-error" class="text-red-500 text-sm hidden text-center"></div>
                </form>
            </div>

        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl p-8 max-w-sm w-full shadow-2xl transform transition-transform">
            <div class="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mb-4 mx-auto">
                <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2 text-center">Delete Post?</h3>
            <p class="text-sm text-gray-500 mb-6 text-center">Are you sure you want to permanently delete this post? This action cannot be undone.</p>
            <div class="flex justify-center space-x-3">
                <button onclick="closeDeleteModal()" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Cancel</button>
                <button onclick="confirmDeletePost()" class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shadow-sm">Yes, delete it</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // Supabase Initialization
        const SUPABASE_URL = 'https://bcjtkfipcfvvitglgpys.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjanRrZmlwY2Z2dml0Z2xncHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNDU3NjcsImV4cCI6MjA5MTgyMTc2N30.kgnE2E-xDQT855to1Nz8LNKtwIBGw2QsIw81Us3B_ZA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Rich Text Editor Initialization
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: { 
                toolbar: {
                    container: [
                        [{ 'header': [2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link', 'image'],
                        ['clean']
                    ],
                    handlers: {
                        image: selectLocalImage
                    }
                }
            }
        });

        // Quill Custom Image Handler to upload direct to Supabase
        function selectLocalImage() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async () => {
                const file = input.files[0];
                if (/^image\//.test(file.type)) {
                    saveToServer(file);
                } else {
                    console.warn('You could only upload images.');
                }
            };
        }

        // --- IMAGE COMPRESSION UTILITY ---
        function compressImage(file, maxWidth = 1920, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            if (!blob) return reject(new Error('Canvas is empty'));
                            // Convert to WebP for maximum compression
                            const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + "_compressed.webp", { type: 'image/webp' });
                            resolve(compressedFile);
                        }, 'image/webp', quality);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        async function saveToServer(file) {
            try {
                // Compress before upload for blazing fast inline loading (800px, 60% quality)
                const compressedFile = await compressImage(file, 800, 0.60);
                const fileName = `inline_${Math.random()}.webp`;
                
                const { data, error } = await supabaseClient.storage
                    .from('blog-media')
                    .upload(fileName, compressedFile, { cacheControl: '3600', upsert: false });
                    
                if (error) {
                    alert("Image upload failed: " + error.message);
                    return;
                }
                
                const { data: urlData } = supabaseClient.storage.from('blog-media').getPublicUrl(fileName);
                insertToEditor(urlData.publicUrl);
            } catch(e) {
                alert("Failed to compress image: " + e.message);
            }
        }

        function insertToEditor(url) {
            const range = quill.getSelection();
            if(range) {
                quill.insertEmbed(range.index, 'image', url);
            } else {
                quill.insertEmbed(quill.getLength(), 'image', url);
            }
        }

        // -------------------------
        // AUTHENTICATION
        // -------------------------
        
        async function checkSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                loadPosts();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('hidden');
            }
        }
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Signing in...';
            
            const user = document.getElementById('username').value + "@smithandadams.com";
            const pass = document.getElementById('password').value;
            const err = document.getElementById('login-error');
            
            const { error } = await supabaseClient.auth.signInWithPassword({ email: user, password: pass });
            if (error) {
                err.textContent = error.message;
                err.classList.remove('hidden');
            } else {
                window.location.reload();
            }
            btn.innerHTML = 'SIGN IN';
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        checkSession();

        // -------------------------
        // DASHBOARD NAVIGATION
        // -------------------------
        function showView(viewId) {
            document.getElementById('posts-view').classList.add('hidden');
            document.getElementById('editor-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
            
            if(viewId === 'editor-view') {
                document.getElementById('post-form').reset();
                document.getElementById('post-id').value = '';
                quill.root.innerHTML = '';
                document.getElementById('image-preview').classList.add('hidden');
                document.getElementById('editor-title').textContent = 'Create New Post';
            }
            if(viewId === 'posts-view') loadPosts();
        }

        // -------------------------
        // POST CRUD
        // -------------------------
        async function loadPosts() {
            const { data, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('posts-tbody');
            if(error) return console.error(error);
            
            tbody.innerHTML = '';
            data.forEach(post => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-bold text-[#0C1E28]">${post.title}</td>
                    <td class="p-4"><span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold uppercase">${post.category}</span></td>
                    <td class="p-4 text-sm text-gray-500">${new Date(post.created_at).toLocaleDateString()}</td>
                    <td class="p-4 text-right">
                        <button onclick='editPost(${JSON.stringify(post).replace(/'/g, "&#39;")})' class="text-blue-500 hover:underline mr-4 font-bold text-sm">Edit</button>
                        <button onclick='deletePost("${post.id}")' class="text-red-500 hover:underline font-bold text-sm">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.editPost = function(post) {
            showView('editor-view');
            document.getElementById('editor-title').textContent = 'Edit Post';
            document.getElementById('post-id').value = post.id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-category').value = post.category;
            document.getElementById('post-readtime').value = post.read_time;
            document.getElementById('post-excerpt').value = post.excerpt;
            document.getElementById('post-image-url').value = post.image_url;
            
            if (post.image_url) {
                const img = document.getElementById('image-preview');
                img.src = post.image_url;
                img.classList.remove('hidden');
            }
            quill.root.innerHTML = post.content;
        };

        let postToDeleteId = null;

        window.deletePost = function(id) {
            postToDeleteId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        };

        window.closeDeleteModal = function() {
            postToDeleteId = null;
            document.getElementById('delete-modal').classList.add('hidden');
        };

        window.confirmDeletePost = async function() {
            if(postToDeleteId) {
                const btn = document.querySelector('#delete-modal button.bg-red-600');
                const originalText = btn.textContent;
                btn.textContent = "Deleting...";
                btn.disabled = true;
                
                await supabaseClient.from('posts').delete().eq('id', postToDeleteId);
                
                btn.textContent = originalText;
                btn.disabled = false;
                closeDeleteModal();
                loadPosts();
            }
        };

        function generateSlug(text) {
            return text.toString().toLowerCase().trim()
                .replace(/\\s+/g, '-')
                .replace(/[^\\w\\-]+/g, '')
                .replace(/\\-\\-+/g, '-');
        }

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const err = document.getElementById('editor-error');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader" class="animate-spin"></i> Saving...`;
            lucide.createIcons();
            
            try {
                // 1. Upload Image if selected
                const fileInput = document.getElementById('post-image');
                let publicUrl = document.getElementById('post-image-url').value;
                
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    // Extreme Compress Cover Image (800px width, 60% quality WebP)
                    const compressedFile = await compressImage(file, 800, 0.60);
                    const fileName = `cover_${Math.random()}.webp`;
                    
                    const { data, error: uploadErr } = await supabaseClient.storage
                        .from('blog-media')
                        .upload(fileName, compressedFile, { cacheControl: '3600', upsert: false });
                        
                    if (uploadErr) throw uploadErr;
                    
                    const { data: urlData } = supabaseClient.storage.from('blog-media').getPublicUrl(fileName);
                    publicUrl = urlData.publicUrl;
                }

                if (!publicUrl) throw new Error("A cover image is required!");

                // 2. Save Post
                const postData = {
                    title: document.getElementById('post-title').value,
                    slug: generateSlug(document.getElementById('post-title').value),
                    category: document.getElementById('post-category').value,
                    read_time: document.getElementById('post-readtime').value,
                    excerpt: document.getElementById('post-excerpt').value,
                    content: quill.root.innerHTML,
                    image_url: publicUrl
                };

                const id = document.getElementById('post-id').value;
                if (id) {
                    const { error } = await supabaseClient.from('posts').update(postData).eq('id', id);
                    if (error) throw error;
                } else {
                    // Create New
                    const { error } = await supabaseClient.from('posts').insert([postData]);
                    if (error) throw error;
                }

                showView('posts-view');
            } catch (error) {
                err.textContent = error.message;
                err.classList.remove('hidden');
            }
            
            btn.innerHTML = originalText;
        });

    </script>
</body>
</html>
